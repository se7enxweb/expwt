#?ini charset="utf-8"?
# expwt, the site-side management sidebar of Exponential (it replaces ezwt, the website toolbar).
# Guide: extension/expwt/doc/eng-us/expwt.md
#
# Every setting below is commented out on purpose: its default is in the code (expwtSettings), so this file
# sets nothing. The kernel reads the settings of an extension in ActiveExtensions[] AFTER
# settings/siteaccess/<siteaccess>/ (the order: settings/, the ActiveAccessExtensions[] of the siteaccess,
# extension/*/settings/siteaccess/<siteaccess>/, settings/siteaccess/<siteaccess>/, the ActiveExtensions[]
# - the first listed read last -, settings/override/), so a value set here would win over every
# siteaccess. Set them:
#   per siteaccess    settings/siteaccess/<siteaccess>/expwt.ini.append.php
#   everywhere        settings/override/expwt.ini.append.php, or an extension of your own in ActiveExtensions[]
#                     (its settings/expwt.ini.append.php; that one also wins over every siteaccess)
# Never uncomment a line in this file: copy it into one of those files.

[ExpwtSettings]
# The sidebar on the pages of this siteaccess: enabled or disabled. Off by default until expwt 1.0
# (rollout behind a setting); ./console exp:wt:migrate-from-ezwt --apply switches it on where ezwt was active.
#Enabled=disabled

# The sidebar in the administration's siteaccesses: disabled (default) or enabled. An administration is
# what the kernel's siteaccess menu counts as one (site.ini [AdminSiteAccessMenu] AdminSiteAccessList[],
# else an administration design: admin, admin2, admin3, admin4, admin4l, adminui, the editor's).
# Disabled there: not one byte, not one request, no hook output and no response filter.
#ShowInAdmin=disabled

# Only these siteaccesses (empty: every siteaccess where Enabled=enabled), and never these.
#SiteAccessList[]
#SiteAccessExcludeList[]

# Visitors who are not signed in (sign in, language, light or dark, search):
#   disabled  (default) not one byte and not one request for them
#   enabled   every visitor sees the closed tab
#   policy    only when the Anonymous user's roles grant expwt/use (the setup never grants it to Anonymous)
# Any other value counts as disabled.
#ShowToAnonymous=disabled

# How the sidebar talks to the server: rest (the expwt endpoints: expwt/api for the browser's session,
# /api/expwt/v1/<action> for a token) or graphql (the GraphQL API: graphql/query for the browser's
# session, /api/graphql for a token, with the persisted queries in extension/expwt/graphql/persisted).
# graphql falls back to rest while the GraphQL API is switched off in the siteaccess.
#DataLayer=rest

# Pagelayouts without the hook (design:pagelayout/hooks/body_end.tpl) get the sidebar placed before
# </body> by a response filter: enabled or disabled.
#InjectWithoutHook=enabled

# Where the sidebar is on a first visit; every user moves and resizes it, and the server keeps it.
# DefaultEdge: left, right, top or bottom; empty (shipped): DefaultSide, the setting from before the top
# and bottom edges (left or right), so an override that sets only DefaultSide keeps working. On top and
# bottom the sidebar is a horizontal bar whose tab is anchored at DefaultAlign: start (the left end) or
# end (the right end).
#DefaultEdge=
#DefaultAlign=end
#DefaultSide=right
# Width of the panel on the left and right edges, height of the bar on the top and bottom edges (CSS pixels).
#DefaultWidth=380
#MinWidth=300
#MaxWidth=720
#DefaultHeight=280
#MinHeight=160
#MaxHeight=640

# Pages narrower than this many CSS pixels get the open panel over the page instead of beside it.
#OverlayBelowWidth=768

# The keyboard shortcut that opens the sidebar and puts the focus in it (Alt+Shift+<key>).
#ShortcutKey=E

# How the tabs of the panels and the closed tab are labeled for users who have not chosen (each user chooses in
# the Me panel, a visitor in the Welcome panel): icons (the icon alone; the name stays the tooltip and what screen
# readers say), both (the icon and the name) or text (the name alone). Any other value counts as icons. The icons
# are the kernel's Bootstrap Icons (share/icons/bootstrap-icons); a kernel without them gets the names.
#TabLabels=icons

# The CSS selector of the site header: the tab sits just below it, then sticks to the top of the window.
#HeaderSelector=header, [role=banner], #header, .header

# The CSS selector of things the site fixes to the bottom of the window (a footer, a cookie bar): the bar
# on the bottom edge sits above whichever of them is fixed or sticky there at the moment.
#FooterSelector=footer, [role=contentinfo], #cookie-bar, .cookie-bar, #cookie-banner, .cookie-banner, #cookie-consent, .cookie-consent, .cc-window, #CybotCookiebotDialog, #onetrust-banner-sdk

[CreateSettings]
# Classes never offered by Create (copied from ezwt's HiddenContentClasses[] by the migration).
#HiddenClassList[]
#HiddenClassList[]=common_ini_settings

[LockSettings]
# Seconds a soft lock lasts without a heartbeat from the editor who holds it.
#LockSeconds=300

[DevicePreviewSettings]
# The frames of the device preview (the Page panel's Devices): id;name;width;height, the width and height
# of the window in CSS pixels (240 to 2560 wide, 240 to 2400 high). The name is translated where the
# sidebar's catalogue has it. "1920 wide at 200% zoom" is a 1920 pixel wide window zoomed to 200%: the
# page lays out as at 960 pixels. Each user may also add frames of a width of their own (240 to 2560).
#DeviceList[]
#DeviceList[]=iphone13;iPhone 13;390;844
#DeviceList[]=pixel7;Pixel 7;412;915
#DeviceList[]=tablet;Tablet;820;1180
#DeviceList[]=zoom200;1920 wide at 200% zoom;960;900
#DeviceList[]=desktop;Desktop;1440;900
# The frames shown when the preview first opens in a browser (ids of DeviceList[]); empty: all of them.
# After that each browser remembers which frames its user toggled on or off (Show all brings them all back).
#ShownDeviceList[]

[Comments]
# Comments held for moderation: enabled or disabled (default). Enabled, a comment (the class of expservices.ini
# [Community] CommentClass, else comment) published for the first time is hidden right after publishing when its
# creator may not approve it (no content/hide of the comment), so moderators' own comments and replies stay
# visible. The Page panel lists it as waiting for moderation; Approve reveals it.
#HideNew=disabled

[RolePanelSettings]
# The order and visibility of the panels per role (E9), set in Setup > Website sidebar panels, which
# writes them to settings/siteaccess/<siteaccess>/expwt.ini.append.php (a backup of the file before every
# change, earlier versions restorable there). RoleList[]: the roles (their ids) with panels of their own,
# the first decides the order for a user with several of them; per role a group:
#   [RolePanels_<role id>]
#   PanelOrder[]          the panels in this order; the others follow in the sidebar's own order
#   HiddenPanelList[]     panels its users do not see; a panel stays shown when another role of the
#                         same user (in RoleList[]) shows it; Page and Me are always shown
# Hiding is the sidebar's look only: what users may do stays with the policies of their roles.
# Not set here (shipped): every user sees the panels in the sidebar's own order. Never set RoleList[] in
# an extension's settings/expwt.ini.append.php: the settings of active extensions are read after
# settings/siteaccess/, so that would decide for every siteaccess (Setup then says so).
#RoleList[]

[BrandingSettings]
# The sidebar's look per siteaccess (E10), set in settings/siteaccess/<siteaccess>/expwt.ini.append.php. Empty
# (shipped): the sidebar's own name and the admin4 accent. Help always keeps "Website sidebar of Exponential".
# Name: shown in place of "Website sidebar" (the panel's heading, the tab's tooltip); at most 60 characters,
# not translated.
#Name=
# Logo: beside the name on the left and right edges (not in the one-row bar on top and bottom), at most 32 pixels
# high. A path from the site's root or an https address of an svg, png, webp, jpg, gif or avif file, e.g.
# /extension/mysite/design/mysite/images/sidebar-logo.svg. Shown with an empty alt text: the name says it.
#Logo=
# AccentColor: #rrggbb (or #rgb), the fill of the selected tab and the main buttons in the light mode. Checked
# (WCAG 2.2 AA): white or near-black text has to reach 4.5:1 on it, and it 3:1 against the panel; a color that
# fails is not used and Setup > Website sidebar panels says why. Links and the focus ring get a darker shade of
# it where it is too light for text.
#AccentColor=
# AccentColorDark: the same for the dark mode (checked against the dark panel); empty: AccentColor, lightened
# in steps until it passes there.
#AccentColorDark=
